[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cs163-rfi"
version = "1.0.0"
description = "Voltage-domain RFI experiments for CS163"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8", "torch>=2.2", "pandas>=2"]

[project.optional-dependencies]
test = ["pytest>=8"]
notebook = ["jupyterlab>=4", "nbclient>=0.10", "nbconvert>=7", "nbformat>=5"]

[tool.setuptools.packages.find]
where = ["src", "vendor/dsa110/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
